[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safesort-cli"
version = "1.0.0"
description = "A preview-first file organizer with undo support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = { text = "MIT" }
authors = [{ name = "nara-l98a" }]

[project.scripts]
safesort = "safesort.app:main"

[tool.setuptools.packages.find]
where = ["src"]
